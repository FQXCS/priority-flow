server:
  port: 8080

spring:
  application:
    name: priority-flow
  # 单实例部署，开启虚拟线程应对 WebSocket 长连接与并发写
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist：首次启动自动建库（utf8mb4 在 Flyway 建表语句中指定）
    url: jdbc:mysql://localhost:3306/priority_flow?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: renyangming
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
      logic-delete-field: delFlag
      logic-delete-value: '1'
      logic-not-delete-value: '0'

logging:
  level:
    com.sdecloud.priorityflow: info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

pf:
  jwt:
    # HS256 签名密钥，生产环境务必通过环境变量覆盖
    secret: "pf-default-jwt-secret-9f2c7a1e5b8d4a63c0e7f1b2d9a8c3e5"
    access-token-hours: 2
    refresh-token-days: 7
  minio:
    endpoint: http://192.168.0.102:9000
    access-key: minioadmin
    secret-key: minioadmin
    # 注意：S3/MinIO 桶名不允许下划线，故使用 priority-flow（连接信息中的 priority_flow 不符合 S3 命名规范）
    bucket: priority-flow
  # 预签名 URL 有效期（分钟）
  presign-expire-minutes: 15
