server:
  port: 8080

spring:
  application:
    name: priority-flow
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 集成测试使用独立库，Flyway 自动建表
    url: jdbc:mysql://localhost:3306/priority_flow_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: renyangming
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
      logic-delete-field: delFlag
      logic-delete-value: '1'
      logic-not-delete-value: '0'

logging:
  level:
    com.sdecloud.priorityflow: warn

pf:
  jwt:
    secret: "pf-test-jwt-secret-9f2c7a1e5b8d4a63c0e7f1b2d9a8c3e5"
    access-token-hours: 2
    refresh-token-days: 7
  minio:
    endpoint: http://192.168.0.102:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: priority-flow
  presign-expire-minutes: 15
